name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"

      - name: Build sdr.exe
        shell: cmd
        run: build.bat

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/sdr.exe --clobber

  build-macos:
    # The Windows job creates the release. Two jobs creating it at once would race.
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"

      - name: Build sdr
        run: ./build.sh

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A bare file downloaded from a release loses its executable bit.
          tar -czf sdr-macos-arm64.tar.gz -C dist sdr
          gh release upload "$TAG" sdr-macos-arm64.tar.gz --clobber

  build-linux:
    needs: build
    runs-on: ubuntu-latest
    # Built on Ubuntu 22.04, the binary runs on distributions with glibc 2.35 or later.
    container: ubuntu:22.04
    steps:
      - name: Install tools
        run: apt-get update && apt-get install -y git curl ca-certificates gh

      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"

      - name: Build sdr
        shell: bash
        run: ./build.sh

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          tar -czf sdr-linux-x86_64.tar.gz -C dist sdr
          gh release upload "$TAG" sdr-linux-x86_64.tar.gz --clobber
