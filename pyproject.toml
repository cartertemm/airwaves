[project]
name = "airwaves"
version = "0.1.0"
description = "A radio receiver for RTL-SDR dongles, and tools that find radio stations and their stream URLs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"numpy",
	"pyaudio",
	"pyrtlsdr",
	"pyrtlsdrlib",
	"scipy",
]

[project.optional-dependencies]
sonos = [
	"lameenc",
	"soco",
]
airplay = [
	"lameenc",
	"pyatv",
]

[project.scripts]
sdr = "airwaves.sdr:main"
broadcastify = "airwaves.broadcastify:main"
iheart = "airwaves.iheart:main"
radio-locator = "airwaves.radiolocator:main"
streema = "airwaves.streema:main"
tunein = "airwaves.tunein:main"
zipsignal = "airwaves.zipsignal:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
