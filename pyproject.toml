[project]
name = "airwaves"
version = "0.3"
description = "A radio receiver for RTL-SDR dongles, and tools that find radio stations and their stream URLs."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = [
	"airportsdata",
	"lameenc",
	"numpy",
	"pyaudio",
	# 0.4 and later need functions that the osmocom driver in the package does not have.
	"pyrtlsdr==0.3.0",
	"pyrtlsdrlib; sys_platform != 'win32'",
	# pyrtlsdr 0.3.0 imports pkg_resources, which setuptools 81 removes.
	"setuptools<81",
]

[project.optional-dependencies]
sonos = [
	"soco",
]
airplay = [
	"pyatv",
]

[project.scripts]
sdr = "airwaves.sdr:main"
broadcastify = "airwaves.broadcastify:main"
iheart = "airwaves.iheart:main"
radio-locator = "airwaves.radiolocator:main"
streema = "airwaves.streema:main"
tunein = "airwaves.tunein:main"
zipsignal = "airwaves.zipsignal:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
